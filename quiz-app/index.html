<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b3486">
  <meta name="description" content="Test your knowledge of history, the Bible and geography.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <title>History, Bible &amp; Geography Quiz</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- Home -->
    <section id="screen-home" class="screen active">
      <div class="lang-row">
        <div class="seg" id="lang-seg" role="radiogroup" aria-label="Language">
          <button data-lang="en">EN</button>
          <button data-lang="ko">한국어</button>
        </div>
      </div>

      <header class="hero">
        <div class="logo" aria-hidden="true">📜</div>
        <h1 data-i18n="title"></h1>
        <p class="sub" data-i18n="subtitle"></p>
      </header>

      <div class="cards">
        <button class="cat-card" data-cat="history">
          <span class="cat-icon" aria-hidden="true">🏛️</span>
          <span class="cat-text"><strong data-i18n="cat.history"></strong><small id="best-history"></small></span>
        </button>
        <button class="cat-card" data-cat="bible">
          <span class="cat-icon" aria-hidden="true">📖</span>
          <span class="cat-text"><strong data-i18n="cat.bible"></strong><small id="best-bible"></small></span>
        </button>
        <button class="cat-card" data-cat="geography">
          <span class="cat-icon" aria-hidden="true">🌏</span>
          <span class="cat-text"><strong data-i18n="cat.geography"></strong><small id="best-geography"></small></span>
        </button>
        <button class="cat-card" data-cat="mixed">
          <span class="cat-icon" aria-hidden="true">🎲</span>
          <span class="cat-text"><strong data-i18n="cat.mixed"></strong><small id="best-mixed"></small></span>
        </button>
      </div>

      <div class="settings">
        <div class="setting">
          <span data-i18n="set.level"></span>
          <div class="seg" id="level-seg" role="radiogroup">
            <button data-level="easy" data-i18n="level.easy"></button>
            <button data-level="hard" data-i18n="level.hard"></button>
            <button data-level="all" data-i18n="level.all"></button>
          </div>
        </div>
        <div class="setting">
          <span data-i18n="set.count"></span>
          <div class="seg" id="count-seg" role="radiogroup">
            <button data-count="5">5</button>
            <button data-count="10">10</button>
            <button data-count="20">20</button>
          </div>
        </div>
        <label class="setting">
          <span data-i18n="set.timer"></span>
          <input type="checkbox" id="timer-toggle" class="switch">
        </label>
      </div>
    </section>

    <!-- Quiz -->
    <section id="screen-quiz" class="screen">
      <div class="topbar">
        <button class="icon-btn" id="quit-btn" aria-label="Quit">✕</button>
        <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="score-pill" id="score-pill">0</span>
      </div>
      <div class="timer" id="timer"><div class="timer-fill" id="timer-fill"></div></div>
      <p class="q-meta" id="q-meta"></p>
      <h2 class="question" id="question"></h2>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback" hidden>
        <p class="feedback-title" id="feedback-title"></p>
        <p class="feedback-text" id="feedback-text"></p>
      </div>
      <button class="primary" id="next-btn" hidden></button>
    </section>

    <!-- Results -->
    <section id="screen-result" class="screen">
      <div class="result-top">
        <div class="ring" id="ring"><span id="result-pct">0%</span></div>
        <h2 id="result-title"></h2>
        <p class="sub" id="result-sub"></p>
      </div>
      <div class="actions">
        <button class="primary" id="again-btn" data-i18n="again"></button>
        <button class="secondary" id="home-btn" data-i18n="home"></button>
      </div>
      <h3 class="review-title" data-i18n="review"></h3>
      <ol class="review" id="review"></ol>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
